name: ♻️ Deactivate
# Supprime l'environnement d'une branche supprimée ou d'une PR fermée (pas celui de main).
on:
  pull_request:
    types: [closed]
  delete:
    branches:
      - "**"
      - "!main"

permissions:
  id-token: write  # jeton OIDC demandé par le workflow partagé (token-bureau)
  contents: read
  pull-requests: read

jobs:
  socialgouv:
    uses: socialgouv/workflows/.github/workflows/use-ks-gh-deactivate.yaml@v1
    secrets: inherit
